spring.application.name=SmartNest
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartnest_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8080}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# URL del servicio Python de IA (paraphrase-multilingual-MiniLM-L12-v2)
# Local: http://localhost:8000  |  Produccion: https://tu-api-python.azurewebsites.net
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
groq.api.key=${GROQ_API_KEY:}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
